name: Build Kzig Dylib  
  
on:  
  push:  
    branches: [ "main" ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: macos-latest  
  
    steps:  
      - name: Checkout Repository  
        uses: actions/checkout@v4  
  
      - name: Compile Kzig Dylib  
        run: |  
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)  
          xcrun clang -target arm64-apple-ios12.0 \  
            -isysroot "$SDKPATH" \  
            -dynamiclib \  
            -fobjc-arc \  
            -framework Foundation \  
            -framework UIKit \  
            -framework QuartzCore \  
            -o Kzig.dylib \  
            Kzing.m  
  
      - name: Upload Dylib Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: Kzig-dylib  
          path: Kzig.dylib
